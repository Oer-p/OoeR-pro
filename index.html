<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; }
    .container { max-width: 600px; width: 100%; }

    /* Input Box */
    .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px 16px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #58a6ff; }
    button { padding: 12px 20px; background: #238636; border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; }

    /* Card Hasil */
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; width: 100%; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .judul { font-size: 1.3rem; font-weight: 800; color: #f0f6fc; margin-bottom: 12px; }
    .isi { font-size: 0.95rem; line-height: 1.7; color: #8b949e; margin-bottom: 20px; white-space: pre-line; }
    .divider { height: 1px; background-color: #21262d; margin-bottom: 16px; }
    .footer { display: flex; justify-content: flex-start; }
    .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 500; color: #58a6ff; background-color: rgba(56, 139, 253, 0.1); border: 1px solid rgba(56, 139, 253, 0.3); padding: 6px 14px; border-radius: 20px; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Kolom Input Pertanyaan -->
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Ketik topik atau pertanyaan...">
      <button onclick="prosesJawaban()">Kirim</button>
    </div>

    <!-- Kotak Hasil Jawaban -->
    <div class="card" id="outputCard">
      <h1 class="judul" id="judulHasil">Menunggu Input...</h1>
      <p class="isi" id="teksHasil">Ketik topik di atas lalu tekan tombol Kirim untuk melihat hasilnya.</p>
      <div class="divider"></div>
      <div class="footer">
        <a id="linkSumber" href="https://id.wikipedia.org" target="_blank" class="badge">
          <span>🌐</span>
          <span id="labelSumber">Wikipedia</span>
          <span>&rsaquo;</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    function prosesJawaban() {
      const q = document.getElementById('userInput').value;
      if (!q) return;

      document.getElementById('judulHasil').innerText = q;
      document.getElementById('teksHasil').innerText = "Sedang mensintesis konsep dari jaringan saraf tanpa kata kunci kaku...";
      document.getElementById('labelSumber').innerText = "Wikipedia: " + q;
      document.getElementById('linkSumber').href = "https://id.wikipedia.org/wiki/" + encodeURIComponent(q);
    }
  </script>

</body>
</html>
