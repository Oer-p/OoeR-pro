<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zharful AI - Pesantren</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { 
    background: #06110c; 
    color: #e6ede9; 
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #06110c;
    position: relative;
  }

  /* Header */
  .header {
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #143324;
    position: sticky;
    top: 0;
    background: #06110c;
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 15px; font-weight: 700; color: #f4eedb; }
  .status { font-size: 11px; color: #4ade80; display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 6px #4ade80; }
  .arabic { font-family: 'Amiri', serif; font-size: 17px; color: #d4af37; background: #0c2017; padding: 2px 12px; border-radius: 20px; border: 1px solid #1c4533; }

  /* Chat Container */
  .chat-container {
    flex: 1;
    padding: 24px 18px 120px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* Sapaan Hidup / Typing Animation */
  .welcome-wrap {
    text-align: center;
    margin: 8px auto 14px;
    width: 100%;
    max-width: 95%;
  }
  .salam-arab {
    font-family: 'Amiri', serif;
    font-size: 22px;
    color: #d4af37;
    margin-bottom: 8px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 1s forwards;
  }
  .bismillah-arab {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: #72d99d;
    margin: 10px 0;
    opacity: 0;
    animation: fadeIn 1.2s 0.6s forwards;
  }
  .welcome-text {
    font-size: 14.5px;
    line-height: 1.8;
    color: #edf3f0;
    min-height: 50px;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 15px;
    background: #4ade80;
    animation: blink 0.7s infinite;
    vertical-align: middle;
    margin-left: 3px;
  }

  /* Bubble User */
  .user-bubble {
    text-align: center;
    background: rgba(27, 71, 51, 0.4);
    color: #9fe2bd;
    padding: 10px 18px;
    border-radius: 25px;
    margin: 0 auto;
    font-size: 13.5px;
    max-width: 85%;
    border: 1px solid #24583e;
  }

  /* Jawaban AI dengan Tombol Copy di Pojok Kanan Atas */
  .ai-bubble {
    position: relative;
    text-align: center;
    width: 100%;
    margin: 0 auto;
    padding: 14px 28px 4px 28px;
  }
  .ai-text {
    font-size: 15px;
    line-height: 1.8;
    color: #f1f5f3;
  }
  .arab-text {
    font-family: 'Amiri', serif;
    font-size: 21px;
    color: #ffd977;
    margin: 12px 0;
    line-height: 2;
    direction: rtl;
  }

  /* Tombol Ikon Copy Pojok Kanan Atas (Tanpa Teks) */
  .btn-copy-icon {
    position: absolute;
    top: 0;
    right: 4px;
    background: transparent;
    border: none;
    color: #799788;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .btn-copy-icon:active {
    transform: scale(0.88);
    color: #4ade80;
  }
  .btn-copy-icon svg {
    width: 16px;
    height: 16px;
  }

  /* Input Chat Melayang */
  .input-wrap {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    z-index: 999;
  }
  .input-bar {
    width: 100%;
    max-width: 440px;
    display: flex;
    align-items: center;
    background: #0d241a;
    border: 1.5px solid #286348;
    border-radius: 35px;
    padding: 6px 8px 6px 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.8);
  }
  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .input-bar input::placeholder { color: #6d8a7c; text-align: center; }
  .btn-send {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #d4af37;
    border: none;
    color: #06110c;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand">
      <span style="font-size:22px;">🕌</span>
      <div>
        <h1>ZHARFUL - AI</h1>
        <div class="status"><span class="dot"></span> Status: Manshub (Aktif)</div>
      </div>
    </div>
    <div class="arabic">ظَرْفُ الذَّكَاءِ</div>
  </div>

  <div class="chat-container" id="box">
    <!-- Sapaan Animasi Hidup -->
    <div class="welcome-wrap">
      <div class="salam-arab">السَّلاَمُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ</div>
      <div class="bismillah-arab">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div class="welcome-text">
        <span id="typing-text"></span><span class="cursor" id="cursor"></span>
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-bar">
      <input type="text" id="pesan" placeholder="Tanyakan seputar nahwu / fiqih...">
      <button class="btn-send" onclick="kirim()">➤</button>
    </div>
  </div>
</div>

<script>
// Animasi Typewriter Sapaan Hidup
const salamText = "Selamat datang di Zharful–AI, wadah mudzakarah ilmu Nahwu, Shorof, dan Fiqih Pesantren. Semoga dengan membaca bismillah, Zharful bisa membantu menjawab pertanyaan Anda dengan benar, tepat, dan penuh keberkahan ilmu.";
let textIdx = 0;

function ketikSapaan() {
  if (textIdx < salamText.length) {
    document.getElementById("typing-text").innerHTML += salamText.charAt(textIdx);
    textIdx++;
    setTimeout(ketikSapaan, 25);
  } else {
    setTimeout(() => {
      const cur = document.getElementById("cursor");
      if(cur) cur.style.display = "none";
    }, 1500);
  }
}
setTimeout(ketikSapaan, 1000);

let count = 1;
const copySvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

function copyJawaban(id, btn) {
  const el = document.getElementById(id);
  const text = el.querySelector('.ai-text').innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = checkSvg;
    setTimeout(() => { btn.innerHTML = copySvg; }, 1500);
  });
}

function kirim() {
  const inp = document.getElementById('pesan');
  const val = inp.value.trim();
  if(!val) return;

  const box = document.getElementById('box');
  box.innerHTML += `<div class="user-bubble">"${val}"</div>`;
  inp.value = '';
  window.scrollTo(0, document.body.scrollHeight);

  setTimeout(() => {
    let text = "Mudzakarah untuk bab tersebut sedang ditelaah lebih dalam dari rujukan kitab-kitab turats.";
    let arab = "";

    const q = val.toLowerCase();
    if(q.includes('kalimah') || q.includes('kalimat')) {
      text = "Kalimah (الكلمة) dalam ilmu Nahwu adalah lafadz yang diletakkan untuk menunjukkan makna mufrod (kata tunggal). Kalimah terbagi menjadi 3 bagian: Isim, Fi'il, dan Huruf yang bermakna.";
      arab = "الكَلِمَةُ هِيَ اللَّفْظُ المَوْضُوعُ لِمَعْنًى مُفْرَدٍ";
    } else if(q.includes('isim')) {
      text = "Isim adalah kata yang menunjukkan arti pada dirinya sendiri dan tidak terikat oleh waktu. Tandanya: dapat menerima i'rab khofadh/jer, tanwin, kemasukan alif lam (ال), dan kemasukan huruf jer.";
      arab = "فَالِاسْمُ يُعْرَفُ: بِالْخَفْضِ، وَالتَّنْوِينِ، وَدُخُولِ الْأَلِفِ وَاللَّامِ";
    } else if(q.includes('fi\'il') || q.includes('fiil')) {
      text = "Fi'il adalah kata yang menunjukkan arti pada dirinya sendiri dan terikat dengan waktu (lampau, sekarang, atau masa depan). Tandanya: bisa kemasukan Qad, Sin, Saufa, dan Ta' Ta'nits Sakinah.";
      arab = "وَالْفِعْلُ يُعْرَفُ بِقَدْ، وَالسِّينِ، وَسَوْفَ، وَتَاءِ التَّأْنِيثِ السَّاكِنَةِ";
    } else if(q.includes('kalam')) {
      text = "Kalam adalah lafadz yang tersusun, memberi faedah sempurna, dan disengaja dengan bahasa Arab. Bagian kalam ada 3: Isim, Fi'il, dan Huruf.";
      arab = "الكَلَامُ هُوَ اللَّفْظُ المُرَكَّبُ المُفِيدُ بِالوُضْعِ";
    } else if(q.includes('dzorof') || q.includes('zhorof') || q.includes('dhorof')) {
      text = "Dzorof adalah isim penunjuk waktu atau tempat yang dibaca nashob dengan mentaqdirkan makna 'fī' (di dalam/pada). Dibagi menjadi Dzorof Zaman dan Dzorof Makan.";
      arab = "ظَرْفُ الزَّمَانِ هُوَ اسْمُ الزَّمَانِ الْمَنْصُوبُ بِتَقْدِيرِ فِي";
    }

    const currentId = "item-" + count++;
    let out = `
      <div class="ai-bubble" id="${currentId}">
        <button class="btn-copy-icon" onclick="copyJawaban('${currentId}', this)" title="Salin Jawaban">${copySvg}</button>
        <div class="ai-text">${text}</div>`;
    if(arab) out += `<div class="arab-text">${arab}</div>`;
    out += `</div>`;
    
    box.innerHTML += out;
    window.scrollTo(0, document.body.scrollHeight);
  }, 400);
}

document.getElementById('pesan').addEventListener('keypress', function(e) {
  if(e.key === 'Enter') kirim();
});
</script>
</body>
</html>
