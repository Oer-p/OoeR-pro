<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zharful AI - Pesantren Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { 
    background: #06110c; 
    color: #e6ede9; 
    display: flex; 
    justify-content: center; 
    height: 100dvh; 
    overflow: hidden; 
  }
  .chat-app { 
    width: 100%; 
    max-width: 500px; 
    height: 100dvh; 
    display: flex; 
    flex-direction: column; 
    background: #06110c; 
  }

  /* Topbar Minimalis */
  .topbar { 
    padding: 14px 20px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    border-bottom: 1px solid rgba(27, 71, 51, 0.4);
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .avatar { font-size: 22px; }
  .title h1 { font-size: 15px; font-weight: 700; color: #f4eedb; letter-spacing: 0.5px; }
  .title p { font-size: 11px; color: #4ade80; display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 6px #4ade80; }
  .arabic-badge { font-family: 'Amiri', serif; font-size: 16px; color: #d4af37; background: #0c2017; padding: 3px 12px; border-radius: 20px; border: 1px solid #1c4533; }

  /* Area Teks / Chat (Tengah & Tanpa Kolom) */
  .chat-box { 
    flex: 1; 
    padding: 24px 20px; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 24px; 
  }

  /* Teks Pertanyaan User */
  .user-text-wrap {
    text-align: center;
    background: rgba(27, 71, 51, 0.25);
    padding: 10px 16px;
    border-radius: 20px;
    margin: 0 auto;
    max-width: 90%;
    color: #a3c9b7;
    font-size: 13.5px;
  }

  /* Teks Jawaban AI (Polos, Bersih & Rata Tengah) */
  .ai-text-wrap {
    text-align: center;
    margin: 0 auto;
    width: 100%;
    max-width: 95%;
  }
  .ai-body {
    font-size: 15px;
    line-height: 1.8;
    color: #f1f5f3;
  }
  .arabic-text {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: #ffd977;
    margin: 12px 0;
    line-height: 2;
    direction: rtl;
  }
  .badge-rujukan {
    display: inline-block;
    color: #8da498;
    font-size: 12px;
    margin-top: 8px;
    background: #0a1b13;
    padding: 3px 12px;
    border-radius: 12px;
    border: 1px solid #163828;
  }

  /* Tombol Kotak Kecil Copy */
  .copy-row {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
  .btn-copy {
    background: #0e261c;
    border: 1px solid #1e4d37;
    color: #c0d8cc;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }
  .btn-copy:active {
    transform: scale(0.93);
    background: #1b4733;
    color: #fff;
  }

  /* Bar Input Chat di Tengah */
  .input-container {
    padding: 14px 18px 20px;
    display: flex;
    justify-content: center;
    background: #06110c;
  }
  .input-bar {
    width: 100%;
    max-width: 440px;
    display: flex;
    align-items: center;
    background: #0d2218;
    border: 1px solid #1f4f38;
    border-radius: 30px;
    padding: 4px 6px 4px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 13.5px;
    outline: none;
    text-align: left;
  }
  .input-bar input::placeholder {
    color: #668274;
    text-align: center;
  }
  .btn-send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #d4af37;
    border: none;
    color: #06110c;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="chat-app">
  
  <div class="topbar">
    <div class="logo-area">
      <div class="avatar">🕌</div>
      <div class="title">
        <h1>ZHARFUL – AI</h1>
        <p><span class="dot"></span> Status: Manshub (Aktif)</p>
      </div>
    </div>
    <div class="arabic-badge">ظَرْفُ الذَّكَاءِ</div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="ai-text-wrap" id="msg-0">
      <div class="ai-body">
        Assalamu'alaikum warahmatullah.<br><br>
        Saya <b>Zharful–AI</b>, wadah kecerdasan untuk mudzakarah ilmu Nahwu, Shorof, dan Fiqih Pesantren.<br><br>
        Silakan tanyakan kaidah atau masalah kitab yang ingin dibahas.
      </div>
      <div class="badge-rujukan">📖 Rujukan: Turats Ilmiyyah Pesantren</div>
      <div class="copy-row">
        <button class="btn-copy" onclick="salinTeks('msg-0', this)">
          📋 Salin Jawaban
        </button>
      </div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Tanyakan seputar nahwu / kitab...">
      <button class="btn-send" onclick="kirimPesan()">➤</button>
    </div>
  </div>

</div>

<script>
let msgCount = 1;

function salinTeks(id, btn) {
  const el = document.getElementById(id);
  const bodyText = el.querySelector('.ai-body').innerText;
  navigator.clipboard.writeText(bodyText).then(() => {
    const originalText = btn.innerHTML;
    btn.innerHTML = "✅ Tersalin!";
    btn.style.borderColor = "#4ade80";
    btn.style.color = "#4ade80";
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.style.borderColor = "#1e4d37";
      btn.style.color = "#c0d8cc";
    }, 1800);
  });
}

function kirimPesan() {
  const input = document.getElementById('userInput');
  const chatBox = document.getElementById('chatBox');
  const text = input.value.trim();
  if(!text) return;

  chatBox.innerHTML += `
    <div class="user-text-wrap">
      "${text}"
    </div>
  `;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  setTimeout(() => {
    let jawaban = "Mudzakarah untuk bab tersebut sedang ditelaah dari rujukan kitab-kitab induk turats.";
    let arab = "";
    let rujukan = "Kajian Turats";

    const q = text.toLowerCase();
    if(q.includes('dzorof') || q.includes('zhorof') || q.includes('dhorof')) {
      jawaban = "Dzorof adalah isim yang dibaca nashob dengan mentaqdirkan makna 'fī' (di dalam/pada). Dzorof terbagi dua: Dzorof Zaman (waktu) dan Dzorof Makan (tempat).";
      arab = "ظَرْفُ الزَّمَانِ هُوَ اسْمُ الزَّمَانِ الْمَنْصُوبُ بِتَقْدِيرِ فِي";
      rujukan = "Matan Al-Ajurrumiyyah - Bab Al-Maf'ul Fih";
    } else if(q.includes('kalam') || q.includes('kalimat')) {
      jawaban = "Kalam menurut ulama Nahwu adalah lafadz yang tersusun, berfaedah, dan disengaja dengan bahasa Arab. Bagiannya ada tiga: Isim, Fi'il, dan Huruf yang bermakna.";
      arab = "الكَلَامُ هُوَ اللَّفْظُ المُرَكَّبُ المُفِيدُ بِالوُضْعِ";
      rujukan = "Matan Al-Ajurrumiyyah - Bab Al-Kalam";
    } else if(q.includes('wudhu') || q.includes('fiqih')) {
      jawaban = "Fardhu wudhu menurut madzhab Syafi'i ada 6 perkara: Niat, membasuh muka, membasuh tangan sampai siku, mengusap sebagian kepala, membasuh kaki sampai mata kaki, dan tertib.";
      arab = "فُرُوضُ الْوُضُوءِ سِتَّةُ أَشْيَاءَ";
      rujukan = "Safinatun Naja - Bab Fardhu Wudhu";
    }

    const currentId = "msg-" + msgCount++;
    let html = `
      <div class="ai-text-wrap" id="${currentId}">
        <div class="ai-body">${jawaban}</div>`;
    if(arab) html += `<div class="arabic-text">${arab}</div>`;
    html += `
        <div class="badge-rujukan">📖 Rujukan: ${rujukan}</div>
        <div class="copy-row">
          <button class="btn-copy" onclick="salinTeks('${currentId}', this)">
            📋 Salin Jawaban
          </button>
        </div>
      </div>
    `;

    chatBox.innerHTML += html;
    chatBox.scrollTop = chatBox.scrollHeight;
  }, 500);
}

document.getElementById('userInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') kirimPesan();
});
</script>
</body>
</html>
