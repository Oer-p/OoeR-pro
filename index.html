<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zharful AI - Pesantren Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { background: #07130e; color: #e1e7e4; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
  .chat-app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #0a1812; border-left: 1px solid #143526; border-right: 1px solid #143526; }
  .topbar { padding: 14px 18px; background: #06110c; border-bottom: 1px solid #183e2c; display: flex; align-items: center; justify-content: space-between; }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #1b4733, #d4af37); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 10px rgba(212,175,55,0.3); }
  .title h1 { font-size: 15px; font-weight: 700; color: #f4eedb; letter-spacing: 0.5px; }
  .title p { font-size: 11px; color: #4ade80; display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 6px #4ade80; }
  .arabic-badge { font-family: 'Amiri', serif; font-size: 15px; color: #d4af37; background: #11261d; padding: 4px 12px; border-radius: 20px; border: 1px solid #204b36; }
  .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 12px 15px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; word-wrap: break-word; }
  .user-msg { align-self: flex-end; background: #1b4733; color: #ffffff; border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .ai-msg { align-self: flex-start; background: #0f241a; border: 1px solid #1f4f39; border-bottom-left-radius: 4px; box-shadow: 0 3px 12px rgba(0,0,0,0.4); }
  .arabic-text { font-family: 'Amiri', serif; font-size: 18px; color: #ffd977; margin: 8px 0; direction: rtl; text-align: right; line-height: 1.8; }
  .badge-kitab { display: inline-flex; align-items: center; gap: 6px; background: #060e0a; color: #9bb0a5; font-size: 11px; padding: 4px 10px; border-radius: 6px; margin-top: 8px; border-left: 3px solid #d4af37; }
  .input-area { padding: 12px 14px; background: #06110c; border-top: 1px solid #153827; display: flex; gap: 10px; align-items: center; }
  .input-box { flex: 1; background: #11261d; border: 1px solid #1f4f39; border-radius: 25px; padding: 12px 18px; color: #fff; font-size: 13px; outline: none; }
  .input-box::placeholder { color: #6b8276; }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #d4af37; border: none; color: #0a1812; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .send-btn:active { transform: scale(0.92); }
</style>
</head>
<body>
<div class="chat-app">
  <div class="topbar">
    <div class="logo-area">
      <div class="avatar">🕌</div>
      <div class="title">
        <h1>ZHARFUL - AI</h1>
        <p><span class="dot"></span> Status: Manshub (Aktif)</p>
      </div>
    </div>
    <div class="arabic-badge">ظَرْفُ الذَّكَاءِ</div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg ai-msg">
      Assalamu'alaikum warahmatullah.<br><br>
      Saya <b>Zharful-AI</b>, wadah kecerdasan untuk mudzakarah ilmu Nahwu, Shorof, dan Fiqih Pesantren.<br>
      Silakan tanyakan kaidah atau masalah kitab yang ingin dibahas.
      <br>
      <div class="badge-kitab">📖 Rujukan: Turats Ilmiyyah Pesantren</div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" class="input-box" placeholder="Tanya bab nahwu, shorof, fiqih...">
    <button class="send-btn" onclick="kirimPesan()">➤</button>
  </div>
</div>

<script>
function kirimPesan() {
  const input = document.getElementById('userInput');
  const chatBox = document.getElementById('chatBox');
  const text = input.value.trim();
  if(!text) return;

  chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  setTimeout(() => {
    let jawaban = "Afwan, mudzakarah untuk bab tersebut sedang ditelaah lebih dalam dari referensi kitab kuning.";
    let arab = "";
    let rujukan = "Kajian Turats";

    const q = text.toLowerCase();
    if(q.includes('dzorof') || q.includes('zhorof') || q.includes('dhorof')) {
      jawaban = "Dzorof adalah isim yang dibaca nashob dengan mengira-ngira makna 'fī' (di dalam/pada). Dzorof terbagi dua: Dzorof Zaman (waktu) dan Dzorof Makan (tempat).";
      arab = "ظَرْفُ الزَّمَانِ هُوَ اسْمُ الزَّمَانِ الْمَنْصُوبُ بِتَقْدِيرِ فِي";
      rujukan = "Matan Al-Ajurrumiyyah - Bab Al-Maf'ul Fih";
    } else if(q.includes('kalam') || q.includes('kalimat')) {
      jawaban = "Kalam menurut ulama Nahwu adalah lafadz yang tersusun, berfaedah, dan disengaja dengan bahasa Arab. Bagiannya ada 3: Isim, Fi'il, dan Huruf.";
      arab = "الكَلَامُ هُوَ اللَّفْظُ المُرَكَّبُ المُفِيدُ بِالوُضْعِ";
      rujukan = "Matan Al-Ajurrumiyyah - Bab Al-Kalam";
    } else if(q.includes('fiqih') || q.includes('wudhu') || q.includes('thoharoh')) {
      jawaban = "Fardhu wudhu menurut madzhab Syafi'i ada 6 perkara: Niat, membasuh wajah, membasuh kedua tangan, mengusap sebagian kepala, membasuh kedua kaki, dan tertib.";
      arab = "فُرُوضُ الْوُضُوءِ سِتَّةُ أَشْيَاءَ";
      rujukan = "Safinatun Naja - Bab Fardhu Wudhu";
    }

    let responHtml = `<div class="msg ai-msg">${jawaban}`;
    if(arab) responHtml += `<div class="arabic-text">${arab}</div>`;
    responHtml += `<br><div class="badge-kitab">📖 Rujukan: ${rujukan}</div></div>`;
    
    chatBox.innerHTML += responHtml;
    chatBox.scrollTop = chatBox.scrollHeight;
  }, 600);
}

document.getElementById('userInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') kirimPesan();
});
</script>
</body>
</html>
