<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Response</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; max-width: 600px; width: 100%; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .judul { font-size: 1.35rem; font-weight: 800; color: #f0f6fc; margin-bottom: 14px; line-height: 1.3; }
    .isi { font-size: 0.98rem; font-weight: 400; line-height: 1.7; color: #8b949e; margin-bottom: 22px; }
    .divider { height: 1px; background-color: #21262d; margin-bottom: 16px; }
    .footer { display: flex; justify-content: flex-start; }
    .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 500; color: #58a6ff; background-color: rgba(56, 139, 253, 0.1); border: 1px solid rgba(56, 139, 253, 0.3); padding: 6px 14px; border-radius: 20px; text-decoration: none; }
    .badge:hover { background-color: rgba(56, 139, 253, 0.2); }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="judul">Sintesis Konsep Jaringan Saraf AI</h1>
    <p class="isi">
      Jaringan saraf tiruan tidak bekerja dengan mencocokkan kata kunci kaku. Melalui bobot matematis (neural weights), sistem menyerap relasi antar konsep dan menyusun ide-ide baru secara probabilistik dari nol.
    </p>
    <div class="divider"></div>
    <div class="footer">
      <a href="https://id.wikipedia.org/wiki/Jaringan_saraf_tiruan" target="_blank" class="badge">
        <span>🌐</span>
        <span>Wikipedia: Jaringan Saraf Tiruan</span>
        <span>&rsaquo;</span>
      </a>
    </div>
  </div>
</body>
</html>
