<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zharful AI - Pesantren</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { 
    background: #06110c; 
    color: #e6ede9; 
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #06110c;
    position: relative;
  }
  /* Header */
  .header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #143324;
    position: sticky;
    top: 0;
    background: #06110c;
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 16px; font-weight: 700; color: #f4eedb; }
  .status { font-size: 11px; color: #4ade80; display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }
  .arabic { font-family: 'Amiri', serif; font-size: 17px; color: #d4af37; background: #0c2017; padding: 2px 12px; border-radius: 20px; border: 1px solid #1c4533; }

  /* Chat List */
  .chat-container {
    flex: 1;
    padding: 24px 18px 120px; /* Jarak bawah agar tidak tertutup tombol chat */
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .user-bubble {
    text-align: center;
    background: #11291d;
    color: #8be3b1;
    padding: 10px 16px;
    border-radius: 20px;
    margin: 0 auto;
    font-size: 13.5px;
    max-width: 85%;
    border: 1px solid #1d4833;
  }
  .ai-bubble {
    text-align: center;
    width: 100%;
    margin: 0 auto;
  }
  .ai-text {
    font-size: 15.5px;
    line-height: 1.8;
    color: #f1f5f3;
  }
  .arab-text {
    font-family: 'Amiri', serif;
    font-size: 21px;
    color: #ffd977;
    margin: 12px 0;
    line-height: 2;
    direction: rtl;
  }
  .ref {
    display: inline-block;
    color: #8ca397;
    font-size: 11.5px;
    background: #091710;
    padding: 4px 12px;
    border-radius: 12px;
    margin-top: 8px;
    border: 1px solid #183827;
  }
  .btn-copy {
    margin-top: 10px;
    background: #0d2419;
    border: 1px solid #1e4d35;
    color: #c1dad0;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 11.5px;
    cursor: pointer;
  }

  /* Input Chat (PASTI MELAYANG DI TENGAH BAWAH) */
  .input-wrap {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    z-index: 999;
  }
  .input-bar {
    width: 100%;
    max-width: 440px;
    display: flex;
    align-items: center;
    background: #0d241a;
    border: 1.5px solid #286348;
    border-radius: 35px;
    padding: 6px 8px 6px 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.8);
  }
  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .input-bar input::placeholder { color: #6d8a7c; text-align: center; }
  .btn-send {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #d4af37;
    border: none;
    color: #06110c;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand">
      <span style="font-size:22px;">🕌</span>
      <div>
        <h1>ZHARFUL - AI</h1>
        <div class="status"><span class="dot"></span> Status: Manshub (Aktif)</div>
      </div>
    </div>
    <div class="arabic">ظَرْفُ الذَّكَاءِ</div>
  </div>

  <div class="chat-container" id="box">
    <div class="ai-bubble" id="item-0">
      <div class="ai-text">
        Assalamu'alaikum warahmatullah.<br><br>
        Saya <b>Zharful–AI</b>, wadah mudzakarah ilmu Nahwu, Shorof, dan Fiqih Pesantren.<br><br>
        Silakan ketik pertanyaan di kolom chat bawah.
      </div>
      <div class="ref">📖 Rujukan: Turats Ilmiyyah Pesantren</div><br>
      <button class="btn-copy" onclick="copyJawaban('item-0', this)">📋 Salin Jawaban</button>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-bar">
      <input type="text" id="pesan" placeholder="Tanyakan seputar nahwu / fiqih...">
      <button class="btn-send" onclick="kirim()">➤</button>
    </div>
  </div>
</div>

<script>
let count = 1;

function copyJawaban(id, btn) {
  const text = document.getElementById(id).querySelector('.ai-text').innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerText = "✅ Tersalin!";
    setTimeout(() => { btn.innerText = "📋 Salin Jawaban"; }, 1500);
  });
}

function kirim() {
  const inp = document.getElementById('pesan');
  const val = inp.value.trim();
  if(!val) return;

  const box = document.getElementById('box');
  box.innerHTML += `<div class="user-bubble">"${val}"</div>`;
  inp.value = '';
  window.scrollTo(0, document.body.scrollHeight);

  setTimeout(() => {
    let text = "Mudzakarah untuk bab tersebut sedang ditelaah dari kitab-kitab turats.";
    let arab = "";
    let ref = "Kajian Turats";

    const q = val.toLowerCase();
    if(q.includes('dzorof') || q.includes('zhorof')) {
      text = "Dzorof adalah isim yang dibaca nashob dengan mentaqdirkan makna 'fī' (di dalam/pada). Dzorof terbagi dua: Dzorof Zaman (waktu) dan Dzorof Makan (tempat).";
      arab = "ظَرْفُ الزَّمَانِ هُوَ اسْمُ الزَّمَانِ الْمَنْصُوبُ بِتَقْدِيرِ فِي";
      ref = "Matan Al-Ajurrumiyyah";
    } else if(q.includes('kalam')) {
      text = "Kalam adalah lafadz yang tersusun, memberi faedah, dan disengaja dengan bahasa Arab. Bagiannya ada 3: Isim, Fi'il, dan Huruf.";
      arab = "الكَلَامُ هُوَ اللَّفْظُ المُرَكَّبُ المُفِيدُ بِالوُضْعِ";
      ref = "Matan Al-Ajurrumiyyah";
    }

    const currentId = "item-" + count++;
    let out = `<div class="ai-bubble" id="${currentId}"><div class="ai-text">${text}</div>`;
    if(arab) out += `<div class="arab-text">${arab}</div>`;
    out += `<div class="ref">📖 Rujukan: ${ref}</div><br><button class="btn-copy" onclick="copyJawaban('${currentId}', this)">📋 Salin Jawaban</button></div>`;
    
    box.innerHTML += out;
    window.scrollTo(0, document.body.scrollHeight);
  }, 400);
}

document.getElementById('pesan').addEventListener('keypress', function(e) {
  if(e.key === 'Enter') kirim();
});
</script>
</body>
</html>
